# T-05: secret *values* live in Secrets Manager, not git.
# External Secrets Operator must be installed on the cluster.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: accounts
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: accounts-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-api
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: accounts-api
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        db-url: "{{ .db_url }}"
  data:
    - secretKey: db_url
      remoteRef:
        key: accounts-api/db
        property: url
