apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-api
  namespace: accounts
  annotations:
    # T-01 / T-10: IRSA. Role ARN is substituted per environment.
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/accounts-api
automountServiceAccountToken: true
---
# Default SA in this namespace must not be used (T-01, T-09).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: accounts
automountServiceAccountToken: false
