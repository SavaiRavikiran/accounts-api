apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: accounts
  labels:
    app.kubernetes.io/name: accounts-api
    app.kubernetes.io/part-of: accounts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: accounts-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounts-api
        app.kubernetes.io/part-of: accounts-api
      annotations:
        # T-02: CI replaces this with the signed digest after build.
        digitalbank.com/image-signed: "true"
    spec:
      serviceAccountName: accounts-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: accounts-api
          # T-02: pin by digest in real CI. Tag kept only as a human alias.
          image: ghcr.io/digitalbank/accounts-api:0.1.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: app-secrets
              mountPath: /var/run/secrets/app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: PORT
              value: "8080"
      volumes:
        - name: app-secrets
          secret:
            secretName: accounts-api
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: accounts-api
