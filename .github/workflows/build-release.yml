# Section 2 — Build and Release Integrity
#
# What this proves: the image running in prod was built by this pipeline from
# this exact commit, with this SBOM, and has not been retagged since.
# What it does NOT prove: that the source code is free of vulnerabilities
# (that's Section 3's job), that the base image vendor wasn't compromised
# upstream of this build, or that the signing identity (this workflow's OIDC
# subject) itself hasn't been abused by a takeover of this repo — see
# DECISIONS-TRADEOFFS.md scenario (b) for that blast radius.
#
# Image name is derived from the repo this workflow actually runs in
# (github.repository, lowercased) rather than hardcoded to the fictional
# "digitalbank" org from the assessment scenario — GHCR's default
# GITHUB_TOKEN can only push packages under the repo's own owner, and OCI
# image refs must be lowercase.

name: build-release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also run the illustrative deploy job (no real cluster/AWS role behind this — see README.md)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # OIDC — no long-lived AWS or registry keys (T-10)
  packages: write    # push to ghcr.io
  attestations: write # SBOM + provenance attestations

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — Section 3 secret scan needs it too

      - name: Compute lowercase image ref and immutable version tag
        id: img
        run: |
          # Immutability comes from the digest, not the tag — but we still
          # avoid ever reusing a floating tag like "latest" or "prod".
          # Tag = short commit SHA; the registry does not allow overwriting a
          # digest once pushed, and this workflow never pushes the same tag
          # twice for different content because the tag *is* the SHA.
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
          provenance: true
          sbom: false # we generate our own SBOM below with Syft for full control over format/attestation

      - name: Generate SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false # deliberately NOT a build-log artifact — see attest step

      - name: Attest SBOM to the image (in-registry, not a build artifact)
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ steps.img.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, Sigstore/Fulcio + Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Keyless: trust root is Sigstore's public Fulcio CA + Rekor
          # transparency log, not a key we manage. Justification: this repo
          # has 40 possible mergers and 2 platform engineers — nobody wants
          # to be the custodian of a long-lived signing key, and keyless
          # binds the signature to "this GitHub Actions workflow, on this
          # repo, on this ref" via the OIDC token, which is the property we
          # actually want (see verify job).
          cosign sign --yes "${IMAGE}@${DIGEST}"

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Verify cosign signature before anything downstream trusts this image
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"

      - name: Verify SBOM attestation (GitHub native attestations, not a cosign-format attestation)
        # actions/attest-sbom writes through GitHub's own Artifact Attestations
        # API (Sigstore-backed, but a different storage/verification path than
        # cosign's own `verify-attestation`) — `gh attestation verify` is the
        # matching verifier, same as a reviewer would run by hand.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE_REF}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --predicate-type "https://spdx.dev/Document/v2.3"

  deploy:
    needs: [build, verify]
    # Illustrative only — no real AWS account/cluster backs this in the
    # take-home (see README.md "Honesty summary"). Never runs on a plain
    # push; only on an explicit manual dispatch with deploy=true, so the
    # normal build-release run on `main` never fails trying to assume a
    # role that doesn't exist.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    environment: production # requires manual approval — see docs/BREAK-GLASS.md for bypass
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Assume AWS deploy role via GitHub OIDC (no static keys — T-10)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::222222222222:role/accounts-api-gha-deploy
          aws-region: ap-south-1
      - name: Deploy (kustomize apply against EKS)
        run: |
          echo "kubectl apply -k k8s/ (rewriting image to ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }})"
          echo "Not executed against a real cluster in this take-home — see README.md."
